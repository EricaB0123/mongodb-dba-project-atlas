# MongoDB Example Configuration for TLS and Encryption Controls

storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  tls:
    mode: requireTLS
    certificateKeyFile: /etc/ssl/mongodb/server.pem
    CAFile: /etc/ssl/mongodb/ca.pem
    allowInvalidHostnames: false

security:
  authorization: enabled
  javascriptEnabled: false

processManagement:
  fork: true
  pidFilePath: /var/run/mongodb/mongod.pid

# Additional deployment-specific controls should be added according to
# operating system encryption, KMS integration, and key management design.
